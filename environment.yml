# Environment file for the LUNA Run Control
name: luna

channels:
  - conda-forge
  - defaults
  - paulscherrerinstitute   # ELOG client (not published on PyPI)

dependencies:
  - python
  - numpy
  - matplotlib
  - boost
  - jupyter
  - ipykernel
  - ipywidgets
  - jupyterlab
  - flask
  - flask-sqlalchemy
  - flask-migrate
  - flask-jwt-extended
  - flask-cors
  - root=6.30.4
  - pkgconfig
  - pyserial
  - nodejs
  - pip
  - cmake
  - pybind11        # builds the caendaq Python module
  - jsoncpp         # CaenDigitizer register-config parsing (CAEN build)
  - elog            # PSI py_elog client for the ELOG logbook integration
  - pip:
    - waitress
    - pyjwt>=2.10
    - pycurl
    - pyserial
    - scipy
    - serial