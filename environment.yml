# Environment file for the LUNA Run Control
name: luna

channels:
  - conda-forge
  - defaults

dependencies:
  - python
  - numpy
  - matplotlib
  - boost
  - jupyter
  - ipykernel
  - ipywidgets
  - jupyterlab
  - flask
  - flask-sqlalchemy
  - flask-migrate
  - flask-jwt-extended
  - flask-cors
  - root=6.30.4
  - pkgconfig
  - pyserial
  - nodejs
  - pip
  - pip:
    - docker
    - waitress
    - pyjwt>=2.10
    - pycurl
    - pyserial
    - scipy
    - serial